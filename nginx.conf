events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Preservar protocolo original enviado por Nginx Proxy Manager (https/http)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen       80;
        server_name  localhost;

        # Permitir subida de imágenes promocionales hasta 15 MB (validado en backend)
        client_max_body_size 15m;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Resolución dinámica de DNS interna de Docker para evitar errores 502 tras reinicios
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Proxy inverso hacia el backend Node.js (resultados-astro-api)
        location /api/ {
            set $upstream_api "http://resultados-astro-api:3000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Compatibilidad con rutas legacy PHP por si algún cliente externo o TV antiguo las invoca
        location ~ ^/(obtener_datos|obtener_resultados|get_server_time|list_carousel_images|actualiza_baloto)\.php$ {
            set $upstream_api "http://resultados-astro-api:3000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Manifiesto de versión por compilación (nunca cacheado para detectar despliegues en TVs)
        location = /version.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Assets compilados por Astro con hash en nombre (inmutables y seguros de cachear)
        location ^~ /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Compatibilidad y accesos directos (HTML sin caché)
        location = /panel_validacion.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /panel-validacion/index.html /index.html;
        }

        location = /androidtv.php {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /androidtv/index.html /index.html;
        }

        location = /imagenes {
            return 301 /carrusel-admin/;
        }

        location = /index.php {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /index.html =404;
        }

        location = /index2.php {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files /index.html =404;
        }

        # Bloquear ejecución o servicio de archivos no gráficos en el volumen del carrusel
        location ~* ^/img/carousel/.*\.(php\d*|phtml|phar|pl|py|jsp|asp|aspx|cgi|sh|bash|exe|dll|js|mjs|cjs|html?|xhtml|svg|xml)$ {
            return 403;
        }

        # Imágenes del carrusel sin caché agresivo y cabeceras de endurecimiento
        location /img/carousel/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox;" always;
            try_files $uri =404;
        }

        # Imágenes estáticas del tablero (/img/* excepto /img/carousel/): revalidar siempre sin omitir regex de seguridad
        location /img/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Rutas eliminadas (/admin ya no forma parte del sistema)
        location ^~ /admin {
            return 404;
        }

        # Rutas HTML estáticas de Astro sin caché para que los TVs obtengan siempre la versión vigente
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
