events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Resolución dinámica de DNS interna de Docker para evitar errores 502 tras reinicios
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # Proxy inverso hacia el backend Node.js (resultados-astro-api)
        location /api/ {
            set $upstream_api "http://resultados-astro-api:3000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Compatibilidad con rutas legacy PHP por si algún cliente externo o TV antiguo las invoca
        location ~ ^/(obtener_datos|obtener_resultados|get_server_time|list_carousel_images|actualiza_baloto)\.php$ {
            set $upstream_api "http://resultados-astro-api:3000";
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Compatibilidad con enlaces a /panel_validacion.html y /androidtv.php
        location = /panel_validacion.html {
            try_files /panel-validacion/index.html /index.html;
        }

        location = /androidtv.php {
            try_files /androidtv/index.html /index.html;
        }

        location = /index.php {
            try_files /index.html =404;
        }

        location = /index2.php {
            try_files /index.html =404;
        }

        # Imágenes del carrusel sin caché agresivo para reflejar reemplazos dinámicos
        location /img/carousel/ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Rutas estáticas de Astro
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
